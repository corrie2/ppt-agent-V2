<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ title }}</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --primary: #1a365d;
      --primary-light: #2b6cb0;
      --accent: #3182ce;
      --accent-light: #63b3ed;
      --background: #ffffff;
      --surface: #f7fafc;
      --text: #1a202c;
      --text-secondary: #4a5568;
      --text-muted: #718096;
      --border: #e2e8f0;
      --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
      --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
      --radius: 12px;
      --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Helvetica Neue', Helvetica, Arial, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: var(--text);
      line-height: 1.6;
      overflow: hidden;
    }

    .deck {
      height: 100vh;
      display: flex;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      scroll-behavior: smooth;
      -webkit-overflow-scrolling: touch;
    }

    .slide {
      scroll-snap-align: start;
      flex: 0 0 100vw;
      min-width: 100vw;
      height: 100vh;
      box-sizing: border-box;
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 60px 80px;
      background: var(--background);
      overflow: hidden;
    }

    .slide::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: linear-gradient(90deg, var(--primary), var(--accent));
    }

    /* Cover Slide */
    .slide.cover {
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
      color: white;
      text-align: center;
    }

    .slide.cover::before {
      display: none;
    }

    .slide.cover h1 {
      font-size: 3.5rem;
      font-weight: 700;
      margin-bottom: 20px;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
      line-height: 1.2;
    }

    .slide.cover .objective {
      font-size: 1.5rem;
      opacity: 0.9;
      max-width: 800px;
      margin: 0 auto;
    }

    .slide.cover .page-indicator {
      color: rgba(255, 255, 255, 0.7);
    }

    /* Section Divider */
    .slide.section-divider {
      background: linear-gradient(135deg, var(--accent) 0%, var(--primary-light) 100%);
      color: white;
      text-align: center;
    }

    .slide.section-divider::before {
      display: none;
    }

    .slide.section-divider h1 {
      font-size: 2.5rem;
      font-weight: 600;
      margin-bottom: 15px;
    }

    .slide.section-divider .objective {
      font-size: 1.2rem;
      opacity: 0.9;
    }

    /* Content Slides */
    .slide .content {
      max-width: 1200px;
      width: 100%;
      z-index: 1;
    }

    .slide h1, .slide h2 {
      font-size: 2.2rem;
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 25px;
      line-height: 1.3;
    }

    .slide h2 {
      font-size: 1.8rem;
    }

    .slide .objective {
      font-size: 1.1rem;
      color: var(--text-secondary);
      margin-bottom: 20px;
      font-style: italic;
    }

    .slide .message {
      font-size: 1.25rem;
      color: var(--text);
      margin-bottom: 30px;
      padding: 20px;
      background: var(--surface);
      border-left: 4px solid var(--accent);
      border-radius: 0 var(--radius) var(--radius) 0;
    }

    .slide ul {
      list-style: none;
      margin-bottom: 30px;
    }

    .slide li {
      font-size: 1.1rem;
      color: var(--text);
      padding: 12px 0 12px 30px;
      position: relative;
      border-bottom: 1px solid var(--border);
    }

    .slide li:last-child {
      border-bottom: none;
    }

    .slide li::before {
      content: '▸';
      position: absolute;
      left: 0;
      color: var(--accent);
      font-weight: bold;
    }

    /* Visual Area */
    .visual {
      margin-top: 30px;
      padding: 30px;
      background: var(--surface);
      border-radius: var(--radius);
      border: 2px dashed var(--border);
      min-height: 150px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .visual-inner {
      text-align: center;
      color: var(--text-muted);
    }

    .visual-inner span {
      font-size: 1rem;
      display: block;
      margin-top: 10px;
    }

    /* Big Number Slide */
    .slide.big-number {
      text-align: center;
    }

    .slide.big-number .metric {
      font-size: 6rem;
      font-weight: 800;
      color: var(--primary);
      line-height: 1;
      margin-bottom: 20px;
    }

    .slide.big-number .metric-label {
      font-size: 1.5rem;
      color: var(--text-secondary);
    }

    /* Quote Slide */
    .slide.quote blockquote {
      font-size: 2rem;
      font-style: italic;
      color: var(--text);
      max-width: 800px;
      margin: 0 auto 30px;
      padding: 30px;
      border-left: 5px solid var(--accent);
      background: var(--surface);
      border-radius: 0 var(--radius) var(--radius) 0;
    }

    .slide.quote cite {
      font-size: 1.2rem;
      color: var(--text-secondary);
      display: block;
      text-align: right;
    }

    /* Comparison Slide */
    .slide.comparison .comparison-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 30px;
      margin-top: 30px;
    }

    .slide.comparison .comparison-item {
      padding: 25px;
      background: var(--surface);
      border-radius: var(--radius);
      border: 1px solid var(--border);
    }

    .slide.comparison .comparison-item h3 {
      font-size: 1.3rem;
      color: var(--primary);
      margin-bottom: 15px;
    }

    /* Grid Slide */
    .slide.image-grid-fallback .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 25px;
      margin-top: 30px;
    }

    .slide.image-grid-fallback .grid-item {
      padding: 25px;
      background: var(--surface);
      border-radius: var(--radius);
      border: 1px solid var(--border);
      text-align: center;
    }

    .slide.image-grid-fallback .grid-item h3 {
      font-size: 1.2rem;
      color: var(--primary);
      margin-bottom: 10px;
    }

    /* Page Indicator */
    .page-indicator {
      position: absolute;
      right: 40px;
      bottom: 30px;
      font-size: 14px;
      color: var(--text-muted);
      font-weight: 500;
    }

    /* Navigation */
    .nav-hint {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.7);
      color: white;
      padding: 10px 20px;
      border-radius: 25px;
      font-size: 14px;
      z-index: 100;
      opacity: 0;
      transition: opacity 0.3s;
    }

    .nav-hint.visible {
      opacity: 1;
    }

    /* Responsive */
    @media (max-width: 768px) {
      .slide {
        padding: 40px 30px;
      }

      .slide.cover h1 {
        font-size: 2.5rem;
      }

      .slide h1, .slide h2 {
        font-size: 1.8rem;
      }

      .slide.comparison .comparison-grid {
        grid-template-columns: 1fr;
      }
    }

    /* Print Styles */
    @media print {
      body {
        background: white;
      }

      .deck {
        display: block;
        overflow: visible;
      }

      .slide {
        page-break-after: always;
        height: auto;
        min-height: 100vh;
      }

      .nav-hint {
        display: none;
      }
    }

    /* Animation */
    .slide {
      animation: fadeIn 0.5s ease-in-out;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateX(20px);
      }
      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    /* Callout Styles */
    .callout {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      margin: 20px 0;
    }

    .callout-label {
      font-weight: 600;
      color: var(--primary);
      margin-bottom: 10px;
      font-size: 1.1rem;
    }

    .callout-text {
      color: var(--text);
      line-height: 1.6;
    }

    /* Metric Styles */
    .metrics {
      display: flex;
      gap: 30px;
      margin: 30px 0;
      flex-wrap: wrap;
    }

    .metric-item {
      flex: 1;
      min-width: 150px;
      padding: 20px;
      background: var(--surface);
      border-radius: var(--radius);
      text-align: center;
      border: 1px solid var(--border);
    }

    .metric-value {
      font-size: 2.5rem;
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 5px;
    }

    .metric-label {
      font-size: 0.9rem;
      color: var(--text-secondary);
    }

    /* Result Summary */
    .result-summary {
      background: linear-gradient(135deg, #e6f7ff 0%, #f0f9ff 100%);
      border: 1px solid #91d5ff;
      border-radius: var(--radius);
      padding: 20px;
      margin: 20px 0;
    }

    .result-summary h4 {
      color: var(--primary);
      margin-bottom: 10px;
    }

    .result-summary p {
      color: var(--text);
    }
  </style>
</head>
<body>
  <main class="deck" id="deck">
    {{ slides }}
  </main>

  <div class="nav-hint" id="navHint">使用 ← → 键或滑动切换幻灯片</div>

  <script>
    // Show navigation hint
    const navHint = document.getElementById('navHint');
    navHint.classList.add('visible');
    setTimeout(() => {
      navHint.classList.remove('visible');
    }, 3000);

    // Keyboard navigation
    document.addEventListener('keydown', (event) => {
      const deck = document.getElementById('deck');
      if (!deck) return;

      if (event.key === 'ArrowRight' || event.key === ' ') {
        event.preventDefault();
        deck.scrollBy({ left: window.innerWidth, behavior: 'smooth' });
      }

      if (event.key === 'ArrowLeft') {
        event.preventDefault();
        deck.scrollBy({ left: -window.innerWidth, behavior: 'smooth' });
      }

      if (event.key === 'Home') {
        event.preventDefault();
        deck.scrollTo({ left: 0, behavior: 'smooth' });
      }

      if (event.key === 'End') {
        event.preventDefault();
        deck.scrollTo({ left: deck.scrollWidth, behavior: 'smooth' });
      }
    });

    // Touch navigation
    let touchStartX = 0;
    let touchEndX = 0;

    document.addEventListener('touchstart', (event) => {
      touchStartX = event.changedTouches[0].screenX;
    });

    document.addEventListener('touchend', (event) => {
      touchEndX = event.changedTouches[0].screenX;
      handleSwipe();
    });

    function handleSwipe() {
      const deck = document.getElementById('deck');
      if (!deck) return;

      const swipeThreshold = 50;
      const diff = touchStartX - touchEndX;

      if (Math.abs(diff) > swipeThreshold) {
        if (diff > 0) {
          // Swipe left - next slide
          deck.scrollBy({ left: window.innerWidth, behavior: 'smooth' });
        } else {
          // Swipe right - previous slide
          deck.scrollBy({ left: -window.innerWidth, behavior: 'smooth' });
        }
      }
    }
  </script>
</body>
</html>
